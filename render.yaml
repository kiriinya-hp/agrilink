services:
  - type: web
    name: agrilink
    env: node
    plan: free
    region: frankfurt
    # Build: install all deps + generate Prisma client + build React frontend
    buildCommand: npm run install:all && cd backend && npx prisma generate && cd ../frontend && npm run build
    # Start: run the Express backend (which serves the built frontend from frontend/dist/)
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: GMAIL_USER
        value: agrilink287@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_PASSKEY
        sync: false
      - key: DARAJA_SHORTCODE
        value: "174379"
      - key: DARAJA_ENVIRONMENT
        value: sandbox
